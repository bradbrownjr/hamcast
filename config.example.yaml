# hamcast configuration. Copy to config.yaml and edit.

# Your own callsign. hamcast links to reflectors as this callsign, receive-only.
# Never use someone else's callsign or a made-up one.
callsign: N0CALL

# Your DMR ID (radioid.net) plus a 2-digit hotspot suffix, for DMR streams.
# Pick a suffix none of your own hotspots use.
# dmr_id: 312345699

# Every setting below except streams can also come from an environment
# variable (README, "Configuration"), which wins over this file.

# icecast:
#   # Empty push_url = run the bundled Icecast (port 8000, passwords
#   # generated into data_dir/icecast-passwords.json unless set here).
#   push_url: icecast://source:PASSWORD@your-icecast:8000
#   public_url: https://stream.example.org   # what listeners use
#   bitrate: 32k

# transcription:
#   enabled: true
#   url: http://10.0.0.2:9000   # OpenAI-compatible; empty = built-in Whisper
#   model: small.en

data_dir: /data          # recordings go in <data_dir>/recordings/<stream id>/
dashboard_port: 8080

streams:
  - id: ufb
    name: UFB New England
    description: UFB New England net via XLXUFB
    type: ysf
    host: 97.107.140.110   # US-XLXUFB, YSF 62148
    port: 42000
    mount: /ufb
    record: true

  # DMR: streams on the same host, port and password share one login, so the
  # master sees a single receive-only hotspot. On DMR+ IPSC2 masters each
  # talkgroup is requested as a static talkgroup on TS2, or TS1 with slot: 1
  # (at most 5 per link). Pick the master that carries the network you want:
  # NEDECN talkgroups come only from IPSC2-NEDECN or IPSC2-CAN-TRBO, both on
  # 44-net (AMPRNet), so the host needs a route to 44.0.0.0/8. IPSC2-NEWENGLAND
  # carries Brandmeister talkgroups, not NEDECN's. Leave NEDECN talkgroups on
  # TS2: IPSC2-NEDECN did not deliver TG3123 to a TS1 static (2026-10-19).
  # - id: dirigo
  #   name: ME Dirigo Net
  #   description: Maine Dirigo Net, NEDECN TG 3123
  #   type: dmr
  #   host: 44.52.120.20    # DMR+_IPSC2-NEDECN-HAMNET (Pi-Star DMR_Hosts.txt)
  #   port: 55555
  #   password: PASSWORD    # DMR+ public password
  #   talkgroup: 3123
  #   mount: /dirigo
