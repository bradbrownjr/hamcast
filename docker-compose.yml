# hamcast all in one: bundled Icecast and (optional) built-in Whisper.
# Settings come from .env (see .env.example); nets from config/config.yaml.
services:
  hamcast:
    image: ghcr.io/bradbrownjr/hamcast:latest
    # build: .   # to build from this checkout instead
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./data:/data
    ports:
      - "${DASHBOARD_HOST_PORT:-8080}:8080"
      - "${ICECAST_HOST_PORT:-8000}:8000"
