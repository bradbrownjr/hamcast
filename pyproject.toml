[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hamcast"
version = "0.1.0"
description = "Stream amateur digital voice nets (YSF, DMR) to Icecast, receive-only"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hamcast = "hamcast.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hamcast*"]

[tool.setuptools.package-data]
hamcast = ["dashboard.html"]
