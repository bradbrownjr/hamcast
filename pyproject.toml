[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hamcast"
version = "0.1.0"
description = "Stream amateur digital voice nets (YSF, DMR) to Icecast, receive-only"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
# httpx2 for Starlette 1.x's TestClient, httpx for older Starlette.
dev = ["pytest>=9.0.3", "httpx2>=2.0", "httpx>=0.27"]
# Built-in transcription when no external speech-to-text URL is set.
whisper = ["faster-whisper>=1.2"]

[project.scripts]
hamcast = "hamcast.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hamcast*"]

[tool.setuptools.package-data]
hamcast = ["static/**/*"]
